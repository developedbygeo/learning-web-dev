<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./index.js" />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <main>
      <h1>Rock, Paper, Scissors</h1>
      <article>
        <p>Player: <span id="player-score"></span></p>
        <p>Computer: <span id="computer-score"></span></p>
        <p id="commentary"></p>
      </article>
      <div class="action-buttons">
        <button type="button" id="rock">Rock</button>
        <button type="button" id="paper">Paper</button>
        <button type="button" id="scissors">Scissors</button>
      </div>
    </main>
  </body>
  <script src="index.js"></script>
</html>
